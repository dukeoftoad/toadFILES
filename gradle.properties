# JVM sizing tuned for CI and low-memory dev machines
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.daemon.jvmargs=-Xmx1536m

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Local toolchains (JDK 17 runs the Robolectric test JVM — newer JDK patches break its
# raw FileDescriptor internals).
org.gradle.java.installations.paths=/home/z/my-project/jdk/jdk-17.0.21+9,/home/z/my-project/jdk/jdk-21.0.13+9
