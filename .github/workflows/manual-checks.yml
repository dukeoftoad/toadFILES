name: Manual checks

# The on-demand companions to Android CI (audit A10/A12 follow-ups):
#
#  - instrumented-tests: the on-device suite (androidTest — real filesystem
#    semantics, the on-device zip-slip check, onboarding) never ran anywhere.
#    An emulator job is too flaky and slow to gate every PR, so it runs on
#    demand: before a release, or when a change touches the filesystem layer.
#  - record-screenshots: regenerates the README/docs screenshots from the real
#    Compose UI on Robolectric. They are honest documentation, not verified
#    goldens — this job produces fresh PNGs to review and copy into
#    docs/screenshots/ by hand.
#
# Both jobs are workflow_dispatch only: they can never paint a push or a PR red.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-tests:
    name: On-device instrumented tests (full, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        # ubuntu-latest runners expose nested virtualization; the emulator
        # without KVM is unusably slow.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # minSdk is 34 — anything older cannot install the app at all.
          api-level: 34
          target: google_apis
          arch: x86_64
          # A cold, quiet emulator: no animations, no first-run wizards.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedFullDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toadfiles-instrumented-results
          path: app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

  record-screenshots:
    name: Record README screenshots (full flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Robolectric android-all artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-v1
          restore-keys: robolectric-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record the screenshots
        # TabScreenshotsTest captures only under the record task; in a plain
        # test run every capture is a no-op (see the test's header).
        run: ./gradlew :app:recordRoborazziFullDebug --stacktrace

      - name: Upload recorded screenshots
        uses: actions/upload-artifact@v4
        with:
          name: toadfiles-screenshots
          path: app/build/outputs/roborazzi/**
          if-no-files-found: error
          retention-days: 30
