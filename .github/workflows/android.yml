name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded runs on the same branch/PR are not worth wall-clock time.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Robolectric android-all artifacts
        # Robolectric fetches the android-all jars through its own Maven fetcher
        # into ~/.m2, which the Gradle cache does not cover. Cache them so a
        # Maven Central hiccup cannot fail every test class (PR #25 CI, Nov 2026).
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-v1
          restore-keys: robolectric-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # JDK 17 LTS runs the unit tests: Robolectric's shadows break on JDK 21.0.13+,
        # and the test JVM is pinned to the Java 17 toolchain in app/build.gradle.kts.

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint (release)
        # Some issues only show up with minification on.
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Unit tests
        # Same bounded re-run policy as the release gate: CI-only Robolectric flakes
        # (component statics leaking across sandboxed test classes, Compose timeouts
        # on loaded runners) must not paint main red — they failed 4+ green-commit
        # builds in Nov 2026 with a DIFFERENT random test each time. A real
        # regression fails both passes and keeps the run red.
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace || \
            ./gradlew :app:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: toadFILES-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
