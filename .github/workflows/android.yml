name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # JDK 17 LTS runs the unit tests: Robolectric's shadows break on JDK 21.0.13+,
        # and the test JVM is pinned to the Java 17 toolchain in app/build.gradle.kts.

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint (release)
        # Some issues only show up with minification on.
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK (unsigned)
        # Keeps the release build path honest on every push. Signed releases
        # come from release.yml on tag push.
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: toadFILES-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload (unsigned) release APK
        uses: actions/upload-artifact@v4
        with:
          name: toadFILES-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
        if: always()
