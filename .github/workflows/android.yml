name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded runs on the same branch/PR are not worth wall-clock time.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # JDK 17 LTS runs the unit tests: Robolectric's shadows break on JDK 21.0.13+,
        # and the test JVM is pinned to the Java 17 toolchain in app/build.gradle.kts.

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint (release)
        # Some issues only show up with minification on.
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK (unsigned)
        # Keeps the release build path honest on every push. Signed releases
        # come from release.yml on tag push.
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: toadFILES-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload (unsigned) release APK
        uses: actions/upload-artifact@v4
        with:
          name: toadFILES-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
        if: always()

  instrumented:
    # The JVM suite covers logic, but MediaStore rows, FileProvider grants, package
    # install handoffs and onboarding permission gates only behave for real on
    # Android. Run the instrumentation suite on emulators for the oldest supported
    # platform, a modern LTS, and the current target — device/OEM-specific storage
    # checks stay a manual release checklist (audit finding P2.16).
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    strategy:
      fail-fast: false
      # Advisory on purpose: the checklist (docs/RELEASE_CHECKLIST.md §6) promotes this
      # to blocking only after the matrix has been green on two consecutive releases.
      # A red emulator matrix must never block app-code PRs while it is still being
      # validated — flip continue-on-error to false there, not here.
      continue-on-error: true
      matrix:
        api-level: [ 29, 33, 36 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # Same toolchain pin as the build job; the Gradle worker JVM must match.

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        # GitHub-hosted runners expose nested virtualization; fail loudly here
        # rather than letting the emulator boot time out with a confusing error.
        run: |
          echo 'Checking KVM:'
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # google_apis ships for every supported API level and includes Play-free
          # system images — the app must work without Google Play Services anyway.
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          # -partition-size keeps the userdata partition (default 7.2 GB) within what a
          # hosted runner can still offer after the SDK + system image are installed
          # (FATAL | Not enough space to create userdata partition without it).
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -partition-size 3072
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
