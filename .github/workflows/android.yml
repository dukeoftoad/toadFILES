name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded runs on the same branch/PR are not worth wall-clock time.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Backstop only: a healthy full job runs 6–9 min (Nov 2026). The 45-minute
    # budget let a stalled test JVM die of old age instead of failing fast
    # (run 42192575915: two failures printed, then 39 min of silence).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Robolectric android-all artifacts
        # Robolectric fetches the android-all jars through its own Maven fetcher
        # into ~/.m2, which the Gradle cache does not cover. Cache them so a
        # Maven Central hiccup cannot fail every test class (PR #25 CI, Nov 2026).
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-v1
          restore-keys: robolectric-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # JDK 17 LTS runs the unit tests: Robolectric's shadows break on JDK 21.0.13+,
        # and the test JVM is pinned to the Java 17 toolchain in app/build.gradle.kts.

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (debug, both editions)
        # With product flavors the aggregate lintDebug/lintRelease tasks no longer
        # exist — lint each edition explicitly (docs/LITE_EDITION_PLAN.md §2).
        run: ./gradlew :app:lintFullDebug :app:lintLiteDebug --stacktrace

      - name: Lint (release, both editions)
        # Some issues only show up with minification on.
        run: ./gradlew :app:lintFullRelease :app:lintLiteRelease --stacktrace

      - name: Unit tests (full flavor)
        # The full edition's suite — the flavor-blind contract plus the full-only
        # fixtures in src/testFull (7z pipeline). Lite's delta is deletion, gated by
        # compile-time constants, so its unit suite would re-run the same shared
        # tests minus the full contracts; assemble + lint below still build and
        # check the lite flavor end to end.
        # Same bounded re-run policy as the release gate: CI-only Robolectric flakes
        # (component statics leaking across sandboxed test classes, Compose timeouts
        # on loaded runners) must not paint main red — they failed 4+ green-commit
        # builds in Nov 2026 with a DIFFERENT random test each time. A real
        # regression fails both passes and keeps the run red.
        #
        # Step-level timeout: the suite passes in ~2 min, so 12 is 2x headroom for
        # the bounded re-run (compile + two passes). Without it, a stalled test JVM
        # burns the whole job budget silently — run 42192575915 (Nov 6, 2026) sat
        # 39 min past its last output and died only at the job's timeout-minutes.
        # A hang is a real failure: fail fast and visibly, don't wait it out.
        timeout-minutes: 12
        run: |
          ./gradlew :app:testFullDebugUnitTest --stacktrace || \
            ./gradlew :app:testFullDebugUnitTest --rerun-tasks --stacktrace

      - name: Assemble debug APKs (both editions)
        # With the edition flavors, assembleDebug builds full AND lite debug APKs
        # (docs/LITE_EDITION_PLAN.md §2) — the lite build is this step's real test.
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APKs (both editions, unsigned here)
        # R8 + resource shrinking differ per flavor — the lite flavor's whole point
        # is dead-code stripping, so its minified build is exercised on every push,
        # not discovered at the next release tag. Without the keystore env vars the
        # APKs are simply unsigned (the Release workflow signs for real).
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: toadFILES-debug-apks
          path: |
            app/build/outputs/apk/full/debug/app-full-debug.apk
            app/build/outputs/apk/lite/debug/app-lite-debug.apk
