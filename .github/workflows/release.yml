name: Release

# Builds a signed release APK for a release tag like v1.3.0 and attaches it
# to the matching GitHub Release. This never runs on PRs.
#
# Also covered, after a release was once published straight from the web UI
# (which creates the tag without a git push, so the tag-push trigger never
# fired and the release sat there without an APK):
#   - release: published  — a UI/manual release triggers this workflow, which
#     builds the tag and attaches the APK to that same release;
#   - workflow_dispatch   — re-run a release build for an existing tag by hand.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.10.1)'
        required: true

permissions:
  contents: write   # required to create a Release and upload assets

# A tag push and a UI-published release for the same tag BOTH trigger this workflow
# (see `on:`). Keying the group on the resolved tag means the duplicate event — and
# any manual dispatch racing it — is cancelled instead of building the same tag
# twice in parallel (v2.2.0, Nov 2026: two Release runs started 1s apart and the
# second one failed its gate, painting the tag red next to the green one).
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    # Publishing a release through softprops (as github-actions[bot]) fires the
    # release event too — without this guard every tag push would build the APK
    # twice. Only releases published by a human proceed through that path.
    if: github.event_name != 'release' || github.event.release.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-${DISPATCH_TAG:-${GITHUB_REF#refs/tags/}}}"
          case "$TAG" in
            v[0-9]*) ;; # a release tag, as expected
            *) echo "::error::No release tag resolved for this event (got '$TAG')"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          APK_DATE=$(date -u +"%Y-%m-%d")
          echo "name=toadFILES $TAG ($APK_DATE)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release event checks out the default branch by default; pin the
          # checkout to the exact tag being released so the APK is built from
          # the tagged sources.
          ref: ${{ steps.meta.outputs.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # JDK 17 matches the toolchain pin in app/build.gradle.kts.

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint and unit tests (gate the release)
        # Step-level timeout: GitHub's default job budget is 360 minutes, and a
        # stalled test JVM waits out every one of them (Android CI run 42192575915,
        # Nov 6, 2026: 39 min of silence after the last test output, killed only by
        # the job timeout). The gate passes in ~4 min; 12 covers the bounded re-run.
        # A hang fails the release loudly and quickly instead of stalling it hours.
        timeout-minutes: 12
        run: |
          # Both editions ship from this gate, so both get linted; with product
          # flavors the aggregate lintRelease task no longer exists.
          ./gradlew :app:lintFullRelease :app:lintLiteRelease --stacktrace
          # The full edition's unit suite (the lite flavor's delta is deletion —
          # assemble below builds and signs both APKs).
          # The Robolectric ghost-alias guard test has flaked two release gates at a
          # low rate (static component-settings state leaking across sandboxed test
          # classes; CI-only, never reproduced locally). One bounded full-suite
          # re-run keeps the gate honest: a real regression fails both passes,
          # a known-flaky shadow read survives exactly one.
          ./gradlew :app:testFullDebugUnitTest --stacktrace || \
            ./gradlew :app:testFullDebugUnitTest --rerun-tasks --stacktrace

      - name: Decode release keystore
        env:
          TOADFILES_KEYSTORE_BASE64: ${{ secrets.TOADFILES_KEYSTORE_BASE64 }}
        run: |
          echo "$TOADFILES_KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/toadfiles-release.jks
          echo "Keystore bytes: $(wc -c < ${{ runner.temp }}/toadfiles-release.jks)"

      - name: Assemble signed release APKs (both editions)
        env:
          TOADFILES_KEYSTORE_FILE: ${{ runner.temp }}/toadfiles-release.jks
          TOADFILES_KEYSTORE_PASSWORD: ${{ secrets.TOADFILES_KEYSTORE_PASSWORD }}
          TOADFILES_KEY_ALIAS: ${{ secrets.TOADFILES_KEY_ALIAS }}
          TOADFILES_KEY_PASSWORD: ${{ secrets.TOADFILES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APKs to include tag
        # With the edition flavors (docs/LITE_EDITION_PLAN.md §2) assembleRelease
        # produces BOTH APKs: full keeps the plain toadFILES-<tag> name users know;
        # lite ships side-by-side as toadFILES-lite-<tag>.
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/full/release/app-full-release.apk "artifact/toadfiles-${{ steps.meta.outputs.tag }}.apk"
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "artifact/toadfiles-lite-${{ steps.meta.outputs.tag }}.apk"
          ls -la artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifact/toadfiles-${{ steps.meta.outputs.tag }}.apk
            artifact/toadfiles-lite-${{ steps.meta.outputs.tag }}.apk
          fail_on_unmatched_files: true
