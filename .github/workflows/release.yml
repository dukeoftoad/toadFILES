name: Release

# Triggered by pushing a tag like `v1.3.0` — builds a signed release APK and
# attaches it to a public GitHub Release. Pull requests are deliberately
# excluded (release builds only ever run on main, on tags).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create a Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # JDK 17 LTS is the toolchain target for both the build and the unit tests.

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint and unit tests (gate the release)
        run: |
          ./gradlew :app:lintRelease --stacktrace
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          TOADFILES_KEYSTORE_BASE64: ${{ secrets.TOADFILES_KEYSTORE_BASE64 }}
        run: |
          echo "$TOADFILES_KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/toadfiles-release.jks
          echo "Keystore bytes: $(wc -c < ${{ runner.temp }}/toadfiles-release.jks)"

      - name: Assemble signed release APK
        env:
          TOADFILES_KEYSTORE_FILE: ${{ runner.temp }}/toadfiles-release.jks
          TOADFILES_KEYSTORE_PASSWORD: ${{ secrets.TOADFILES_KEYSTORE_PASSWORD }}
          TOADFILES_KEY_ALIAS: ${{ secrets.TOADFILES_KEY_ALIAS }}
          TOADFILES_KEY_PASSWORD: ${{ secrets.TOADFILES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Read version metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Use the APK's mtime as a stable release name suffix.
          APK_DATE=$(date -u +"%Y-%m-%d")
          echo "name=toadFILES $TAG ($APK_DATE)" >> "$GITHUB_OUTPUT"

      - name: Rename APK to include tag
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk "artifact/toadfiles-${{ steps.meta.outputs.tag }}.apk"
          ls -la artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifact/toadfiles-${{ steps.meta.outputs.tag }}.apk
          fail_on_unmatched_files: true
